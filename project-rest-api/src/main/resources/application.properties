spring.application.name=project-rest-api
server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5432}/projekty
spring.datasource.username=projekty_app
spring.datasource.password=${POSTGRES_PASSWORD:projekty_local}
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
