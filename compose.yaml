name: agile-login-register-local

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: agile
      POSTGRES_USER: projekty_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projekty_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5455}:5432"
    volumes:
      - agile-schema-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      target: api
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projekty_local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 15s

  web:
    build:
      context: .
      target: web
    environment:
      SERVER_ADDRESS: 0.0.0.0
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  agile-schema-data:
