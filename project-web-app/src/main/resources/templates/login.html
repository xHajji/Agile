<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie</title>
    <link rel="stylesheet" href="/projects.css" th:href="@{/projects.css}">
    <link rel="stylesheet" href="/login.css" th:href="@{/login.css}">
</head>
<body class="auth-body">
    <main class="auth-container">
        <header class="auth-header">
            <p class="brand"></p>
            <h1>Witaj ponownie</h1>
            <p class="auth-subtitle">Zaloguj się lub załóż nowe konto</p>
        </header>

        <div class="auth-tabs">
            <button type="button" class="tab active" data-tab="login">Logowanie</button>
            <button type="button" class="tab" data-tab="register">Rejestracja</button>
        </div>

        <section class="auth-panel" id="login-panel">
            <form method="post" action="/login" th:action="@{/login}">
                <div class="form-group">
                    <label for="login-email">Adres e-mail</label>
                    <input id="login-email" name="email" type="email" placeholder="jan.kowalski@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Hasło</label>
                    <input id="login-password" name="password" type="password" required>
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember"> Zapamiętaj mnie
                    </label>
                    <a href="#" class="link">Zapomniałeś hasła?</a>
                </div>
                <button type="submit" class="btn-primary">Zaloguj się</button>
            </form>
        </section>

        <section class="auth-panel hidden" id="register-panel">
            <form method="post" action="/register" th:action="@{/register}">
                <div class="form-group">
                    <label for="register-name">Imię i nazwisko</label>
                    <input id="register-name" name="name" type="text" placeholder="Jan Kowalski" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Adres e-mail</label>
                    <input id="register-email" name="email" type="email" placeholder="jan.kowalski@example.com" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Hasło</label>
                    <input id="register-password" name="password" type="password" required>
                </div>
                <div class="form-group">
                    <label for="register-password-confirm">Potwierdź hasło</label>
                    <input id="register-password-confirm" name="passwordConfirm" type="password" required>
                </div>
                <button type="submit" class="btn-primary">Zarejestruj się</button>
            </form>
        </section>

        <p class="auth-footer">
            <a href="/" th:href="@{/}">← Wróć do strony głównej</a>
        </p>
    </main>

    <script>
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-panel').forEach(p => p.classList.add('hidden'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-panel').classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
